name: build-macos-arm64

on:
  workflow_call:
    inputs:
      odin_version:
        required: true
        type: string
      sdl_version:
        required: true
        type: string

jobs:
  build:
    name: Build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Cache SDL3 build
        uses: actions/cache@v4
        with:
          path: sdl-build
          key: sdl3-${{ inputs.sdl_version }}-${{ runner.os }}-arm64
          restore-keys: sdl3-${{ inputs.sdl_version }}-${{ runner.os }}-

      - name: Install Odin (${{ inputs.odin_version }})
        run: |
          set -euo pipefail
          curl -fsSL -o odin.tar.gz \
            "https://github.com/odin-lang/Odin/releases/download/${{ inputs.odin_version }}/odin-macos-arm64-${{ inputs.odin_version }}.tar.gz"
          sudo mkdir -p /opt/odin
          sudo tar -xzf odin.tar.gz --strip-components=1 -C /opt/odin
          sudo ln -sf /opt/odin/odin /usr/local/bin/odin
          odin version

      - name: Install SDL3 ${{ inputs.sdl_version }} (source build)
        run: |
          set -euo pipefail
          brew install cmake pkg-config
          curl -fsSL -o sdl.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-${{ inputs.sdl_version }}/SDL3-${{ inputs.sdl_version }}.tar.gz"
          tar -xzf sdl.tar.gz
          export CC=clang CXX=clang++
          cmake -S "SDL3-${{ inputs.sdl_version }}" -B sdl-build \
            -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF
          cmake --build sdl-build -j"$(sysctl -n hw.ncpu)"
          sudo cmake --install sdl-build
          rm -rf "SDL3-${{ inputs.sdl_version }}" sdl.tar.gz
          pkg-config sdl3 --modversion

      - name: Build imgui static library
        working-directory: deps/imgui
        run: python3 build.py

      - name: Build
        run: |
          chmod +x scripts/unix/build.sh scripts/unix/_common.sh
          ./scripts/unix/build.sh

      - name: Compute SHA256
        run: bash .github/scripts/compute-sha256.sh

      - name: Package
        run: zip -j bifractal-macos-arm64.zip build/bifractal build/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: bifractal-macos-arm64
          path: bifractal-macos-arm64.zip
          if-no-files-found: error
          retention-days: 14
