name: build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  ODIN_VERSION: dev-2026-08
  SDL_VERSION: 3.4.2

jobs:
  build-linux:
    name: Linux (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Odin (${{ env.ODIN_VERSION }})
        run: |
          set -euo pipefail
          curl -fsSL -o odin.tar.gz \
            "https://github.com/odin-lang/Odin/releases/download/${ODIN_VERSION}/odin-linux-amd64-${ODIN_VERSION}.tar.gz"
          sudo mkdir -p /opt/odin
          sudo tar -xzf odin.tar.gz -C /opt/odin
          sudo ln -sf /opt/odin/odin /usr/local/bin/odin
          odin version

      - name: Install SDL3 ${{ env.SDL_VERSION }} (source build)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            cmake build-essential pkg-config \
            libxext-dev libx11-dev libxkbcommon-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
          curl -fsSL -o sdl.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL3-${SDL_VERSION}.tar.gz"
          tar -xzf sdl.tar.gz
          cmake -S "SDL3-${SDL_VERSION}" -B sdl-build \
            -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF
          cmake --build sdl-build -j"$(nproc)"
          sudo cmake --install sdl-build
          sudo ldconfig
          rm -rf "SDL3-${SDL_VERSION}" sdl.tar.gz sdl-build
          pkg-config sdl3 --modversion

      - name: Build
        run: |
          chmod +x scripts/unix/build.sh scripts/unix/_common.sh
          ./scripts/unix/build.sh

      - name: Strip
        run: strip build/bifractal

      - name: Package
        run: |
          mkdir -p dist/bifractal-linux-x86_64
          cp build/bifractal dist/bifractal-linux-x86_64/
          chmod +x dist/bifractal-linux-x86_64/bifractal
          (cd dist && zip -r ../bifractal-linux-x86_64.zip bifractal-linux-x86_64)
          rm -rf dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bifractal-linux-x86_64
          path: bifractal-linux-x86_64.zip
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Windows (x86_64)
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Install Odin (${{ env.ODIN_VERSION }})
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://github.com/odin-lang/Odin/releases/download/${env:ODIN_VERSION}/odin-windows-amd64-${env:ODIN_VERSION}.zip"
          Invoke-WebRequest -Uri $url -OutFile odin.zip
          Expand-Archive -Path odin.zip -DestinationPath C:\Odin -Force
          "C:\Odin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          odin version

      - name: Build
        run: .\scripts\windows\build.ps1

      - name: Package
        run: |
          $ErrorActionPreference = 'Stop'
          $odinRoot = & odin root
          $stage = "dist/bifractal-windows-x86_64"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item build/bifractal.exe $stage/
          Copy-Item "$odinRoot/vendor/sdl3/SDL3.dll" $stage/
          Compress-Archive -Path $stage -DestinationPath bifractal-windows-x86_64.zip
          Remove-Item -Recurse -Force dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bifractal-windows-x86_64
          path: bifractal-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14

  build-macos-arm64:
    name: macOS (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Odin (${{ env.ODIN_VERSION }})
        run: |
          set -euo pipefail
          curl -fsSL -o odin.tar.gz \
            "https://github.com/odin-lang/Odin/releases/download/${ODIN_VERSION}/odin-macos-arm64-${ODIN_VERSION}.tar.gz"
          sudo mkdir -p /opt/odin
          sudo tar -xzf odin.tar.gz -C /opt/odin
          sudo ln -sf /opt/odin/odin /usr/local/bin/odin
          odin version

      - name: Install SDL3 ${{ env.SDL_VERSION }} (source build)
        run: |
          set -euo pipefail
          brew install cmake pkg-config
          curl -fsSL -o sdl.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL3-${SDL_VERSION}.tar.gz"
          tar -xzf sdl.tar.gz
          cmake -S "SDL3-${SDL_VERSION}" -B sdl-build \
            -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF
          cmake --build sdl-build -j"$(sysctl -n hw.ncpu)"
          sudo cmake --install sdl-build
          rm -rf "SDL3-${SDL_VERSION}" sdl.tar.gz sdl-build
          pkg-config sdl3 --modversion

      - name: Build
        run: |
          chmod +x scripts/unix/build.sh scripts/unix/_common.sh
          ./scripts/unix/build.sh

      - name: Package
        run: |
          mkdir -p dist/bifractal-macos-arm64
          cp build/bifractal dist/bifractal-macos-arm64/
          chmod +x dist/bifractal-macos-arm64/bifractal
          (cd dist && zip -r ../bifractal-macos-arm64.zip bifractal-macos-arm64)
          rm -rf dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bifractal-macos-arm64
          path: bifractal-macos-arm64.zip
          if-no-files-found: error
          retention-days: 14

  build-macos-x86_64:
    name: macOS (x86_64)
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Install Odin (${{ env.ODIN_VERSION }})
        run: |
          set -euo pipefail
          curl -fsSL -o odin.tar.gz \
            "https://github.com/odin-lang/Odin/releases/download/${ODIN_VERSION}/odin-macos-amd64-${ODIN_VERSION}.tar.gz"
          sudo mkdir -p /opt/odin
          sudo tar -xzf odin.tar.gz -C /opt/odin
          sudo ln -sf /opt/odin/odin /usr/local/bin/odin
          odin version

      - name: Install SDL3 ${{ env.SDL_VERSION }} (source build)
        run: |
          set -euo pipefail
          brew install cmake pkg-config
          curl -fsSL -o sdl.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL3-${SDL_VERSION}.tar.gz"
          tar -xzf sdl.tar.gz
          cmake -S "SDL3-${SDL_VERSION}" -B sdl-build \
            -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF
          cmake --build sdl-build -j"$(sysctl -n hw.ncpu)"
          sudo cmake --install sdl-build
          rm -rf "SDL3-${SDL_VERSION}" sdl.tar.gz sdl-build
          pkg-config sdl3 --modversion

      - name: Build
        run: |
          chmod +x scripts/unix/build.sh scripts/unix/_common.sh
          ./scripts/unix/build.sh

      - name: Package
        run: |
          mkdir -p dist/bifractal-macos-x86_64
          cp build/bifractal dist/bifractal-macos-x86_64/
          chmod +x dist/bifractal-macos-x86_64/bifractal
          (cd dist && zip -r ../bifractal-macos-x86_64.zip bifractal-macos-x86_64)
          rm -rf dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bifractal-macos-x86_64
          path: bifractal-macos-x86_64.zip
          if-no-files-found: error
          retention-days: 14
