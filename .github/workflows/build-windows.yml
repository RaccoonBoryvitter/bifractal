name: build-windows

on:
  workflow_call:
    inputs:
      odin_version:
        required: true
        type: string
      sdl_version:
        required: true
        type: string

jobs:
  build:
    name: Build
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Install Odin (${{ inputs.odin_version }})
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://github.com/odin-lang/Odin/releases/download/${{ inputs.odin_version }}/odin-windows-amd64-${{ inputs.odin_version }}.zip"
          Invoke-WebRequest -Uri $url -OutFile odin.zip
          Expand-Archive -Path odin.zip -DestinationPath C:\Odin -Force
          $env:Path = "C:\Odin\dist;$env:Path"
          "C:\Odin\dist" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          odin version

      - name: Build
        run: .\scripts\windows\build.ps1

      - name: Package
        run: |
          $ErrorActionPreference = 'Stop'
          $odinRoot = & odin root
          Compress-Archive -Path build/bifractal.exe, "$odinRoot/vendor/sdl3/SDL3.dll" -DestinationPath bifractal-windows-x86_64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bifractal-windows-x86_64
          path: bifractal-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14
