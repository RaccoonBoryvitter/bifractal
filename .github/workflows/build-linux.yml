name: build-linux

on:
  workflow_call:
    inputs:
      odin_version:
        required: true
        type: string
      sdl_version:
        required: true
        type: string

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Odin (${{ inputs.odin_version }})
        run: |
          set -euo pipefail
          curl -fsSL -o odin.tar.gz \
            "https://github.com/odin-lang/Odin/releases/download/${{ inputs.odin_version }}/odin-linux-amd64-${{ inputs.odin_version }}.tar.gz"
          sudo mkdir -p /opt/odin
          sudo tar -xzf odin.tar.gz --strip-components=1 -C /opt/odin
          sudo ln -sf /opt/odin/odin /usr/local/bin/odin
          odin version

      - name: Install SDL3 ${{ inputs.sdl_version }} (source build)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git make \
            pkg-config cmake ninja-build gnome-desktop-testing libasound2-dev libpulse-dev \
            libaudio-dev libfribidi-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev libusb-1.0-0-dev \
            clang python3 \
            libc++-dev libc++abi-dev
          curl -fsSL -o sdl.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-${{ inputs.sdl_version }}/SDL3-${{ inputs.sdl_version }}.tar.gz"
          tar -xzf sdl.tar.gz
          cmake -S "SDL3-${{ inputs.sdl_version }}" -B sdl-build \
            -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF
          cmake --build sdl-build -j"$(nproc)"
          sudo cmake --install sdl-build
          sudo ldconfig
          rm -rf "SDL3-${{ inputs.sdl_version }}" sdl.tar.gz sdl-build
          pkg-config sdl3 --modversion

      - name: Build imgui static library
        working-directory: deps/imgui
        run: python3 build.py

      - name: Build
        run: |
          chmod +x scripts/unix/build.sh scripts/unix/_common.sh
          ./scripts/unix/build.sh

      - name: Strip
        run: strip build/bifractal

      - name: Package
        run: zip -j bifractal-linux-x86_64.zip build/bifractal

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bifractal-linux-x86_64
          path: bifractal-linux-x86_64.zip
          if-no-files-found: error
          retention-days: 14
