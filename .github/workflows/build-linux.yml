name: build-linux

on:
  workflow_call:
    inputs:
      distro:
        required: true
        type: string
      runner:
        required: true
        type: string
      pkg:
        required: true
        type: string
      odin_version:
        required: true
        type: string
      sdl_version:
        required: true
        type: string

jobs:
  build:
    name: Build (${{ inputs.distro }})
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Cache system packages
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /var/cache/dnf
            /var/cache/pacman/pkg
            /var/cache/zypp
          key: pkg-${{ runner.os }}-${{ inputs.pkg }}-${{ inputs.distro }}
          restore-keys: pkg-${{ runner.os }}-${{ inputs.pkg }}-

      - name: Cache SDL3 build
        uses: actions/cache@v4
        with:
          path: sdl-build
          key: sdl3-${{ inputs.sdl_version }}-${{ runner.os }}-${{ inputs.distro }}
          restore-keys: sdl3-${{ inputs.sdl_version }}-${{ runner.os }}-

      - name: Install Odin (${{ inputs.odin_version }})
        run: |
          set -euo pipefail
          curl -fsSL -o odin.tar.gz \
            "https://github.com/odin-lang/Odin/releases/download/${{ inputs.odin_version }}/odin-linux-amd64-${{ inputs.odin_version }}.tar.gz"
          sudo mkdir -p /opt/odin
          sudo tar -xzf odin.tar.gz --strip-components=1 -C /opt/odin
          sudo ln -sf /opt/odin/odin /usr/local/bin/odin
          odin version

      - name: Install SDL3 ${{ inputs.sdl_version }}
        run: bash .github/scripts/install-sdl3-${{ inputs.pkg }}.sh
        env:
          SDL_VERSION: ${{ inputs.sdl_version }}

      - name: Build imgui static library
        working-directory: deps/imgui
        run: python3 build.py

      - name: Build
        run: |
          chmod +x scripts/unix/build.sh scripts/unix/_common.sh
          ./scripts/unix/build.sh

      - name: Strip
        run: strip build/bifractal

      - name: Compute SHA256
        run: bash .github/scripts/compute-sha256.sh

      - name: Package
        run: |
          zip -j "bifractal-linux-${{ inputs.distro }}.zip" build/bifractal build/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: bifractal-linux-${{ inputs.distro }}
          path: bifractal-linux-${{ inputs.distro }}.zip
          if-no-files-found: error
          retention-days: 14
